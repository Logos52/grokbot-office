<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bot Office</title>
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b1222" />
    <style>
      :root { --bg: #0b1222; --fg: #e8ecf5; --dim: #8b94a8; --chip: rgba(255,255,255,0.06); }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
        font: 14px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #stage { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud { position: fixed; top: 0; left: 0; right: 0; padding: 14px 16px; display: flex; gap: 10px;
        align-items: center; pointer-events: none; }
      #hud h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
      .chip { background: var(--chip); border: 1px solid rgba(255,255,255,0.08); border-radius: 999px;
        padding: 4px 10px; font-size: 12px; color: var(--dim); white-space: nowrap; }
      .chip b { color: var(--fg); font-weight: 600; }
      .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #f2a33a; margin-right: 6px; vertical-align: 1px; }
      .dot.live { background: #4fd37a; }
      .dot.warn { background: #e5484d; }
      .dot.replay { background: #5aa7ff; }
      #replay-btn { pointer-events: auto; font: inherit; font-size: 12px; cursor: pointer; color: var(--fg); }
      #replay-btn:hover { background: rgba(255,255,255,0.12); }
      #replay-btn[hidden] { display: none; }
      #replay { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); width: min(620px, calc(100vw - 32px)); box-sizing: border-box;
        display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; gap: 10px; align-items: center; z-index: 4;
        background: rgba(13,20,36,0.9); border: 1px solid rgba(90,167,255,0.35); border-radius: 14px; padding: 8px 10px; backdrop-filter: blur(6px); font-size: 13px; }
      #replay[hidden] { display: none; }
      #replay button, #replay select { font: inherit; font-size: 13px; color: var(--fg); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
      #replay #r-play { width: 36px; padding: 5px 0; }
      #replay #r-now { background: #2f6fd6; border-color: #2f6fd6; }
      #replay input[type=range] { width: 100%; accent-color: #5aa7ff; }
      #replay #r-time { font-variant-numeric: tabular-nums; color: var(--fg); min-width: 74px; text-align: center; }
      #replay .r-label { grid-column: 1 / -1; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8fc0ff; margin-bottom: -4px; }
      #replay :focus-visible { outline: 2px solid #5aa7ff; outline-offset: 2px; }
      #projects { position: fixed; top: 14px; right: 16px; width: min(300px, calc(100vw - 32px)); background: rgba(13,20,36,0.82); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px; padding: 12px 14px; backdrop-filter: blur(6px); pointer-events: none; }
      #projects h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
      #projects h2 em { font-style: normal; color: #f2a33a; letter-spacing: 0; text-transform: none; font-weight: 600; margin-left: 6px; }
      #projects ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
      #projects li { display: grid; grid-template-columns: minmax(0, 1fr) 96px 38px; gap: 8px; align-items: center; font-size: 13px; }
      #projects .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #projects .track { height: 7px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; }
      #projects .fill { display: block; height: 100%; background: #5aa7ff; border-radius: 4px; }
      #projects li.done .fill { background: #4fd37a; } #projects li.blocked .fill { background: #e5484d; } #projects li.paused .fill { background: #8f9ab3; }
      #projects .pct { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
      #projects .empty { color: var(--dim); }
      @media (max-width: 640px) { #projects { top: auto; bottom: 64px; right: 12px; left: 12px; width: auto; }
        #replay { top: 74px; bottom: auto; width: calc(100vw - 24px); grid-template-columns: auto minmax(0, 1fr) auto; }
        #replay #r-speed { grid-column: 2; justify-self: end; } #replay #r-now { grid-column: 3; } }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 10px; pointer-events: none; }
      #bar > * { pointer-events: auto; }
      #time { display: flex; background: var(--chip); border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; padding: 3px; }
      #time button, #weather { font: inherit; font-size: 12px; color: var(--dim); background: transparent; border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
      #time button.on { background: rgba(255,255,255,0.12); color: var(--fg); }
      #weather { background: var(--chip); border: 1px solid rgba(255,255,255,0.08); text-transform: capitalize; }
      #radio { display: flex; align-items: center; gap: 8px; background: var(--chip); border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; padding: 3px 10px 3px 3px; }
      #radio button { font: inherit; font-size: 12px; color: var(--fg); background: rgba(255,255,255,0.06); border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; min-width: 132px; }
      #radio button.off { color: var(--dim); background: transparent; }
      #radio input { width: 72px; accent-color: #4fd37a; }
      #gear { font: inherit; font-size: 14px; color: var(--fg); background: var(--chip); border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; width: 34px; height: 34px; cursor: pointer; }
      #settings { position: fixed; right: 16px; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); width: min(340px, calc(100vw - 32px)); background: rgba(13,20,36,0.94); border: 1px solid rgba(255,255,255,0.1);
        max-height: calc(100vh - 96px - env(safe-area-inset-bottom, 0px)); overflow-y: auto; overscroll-behavior: contain; box-sizing: border-box;
        border-radius: 14px; padding: 14px 16px 16px; backdrop-filter: blur(8px); display: grid; gap: 14px; font-size: 13px; z-index: 5; }
      #settings[hidden] { display: none; }
      #settings h2 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
      #settings h2 button { font: inherit; color: var(--dim); background: transparent; border: 0; cursor: pointer; font-size: 18px; line-height: 1; }
      #settings h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
      #settings label { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; }
      #settings select, #settings input[type=range] { font: inherit; font-size: 13px; color: var(--fg); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 4px 8px; max-width: 58%; }
      #settings input[type=range] { padding: 0; accent-color: #4fd37a; width: 58%; }
      #settings input[type=checkbox] { accent-color: #4fd37a; width: 16px; height: 16px; }
      #settings .hint { color: var(--dim); font-size: 12px; margin: 2px 0 0; }
      #settings [data-for][hidden], #settings button[hidden] { display: none; }
      #settings input[type=url], #settings input[type=text] { font: inherit; font-size: 13px; color: var(--fg); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 5px 8px; width: 62%; min-width: 0; box-sizing: border-box; }
      #settings input[type=file] { font: inherit; font-size: 12px; color: var(--dim); max-width: 62%; }
      #settings .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
      #settings .btn { font: inherit; font-size: 13px; color: var(--fg); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
      #settings .btn.primary { background: #2f6fd6; border-color: #2f6fd6; }
      #settings .btn:disabled { opacity: 0.45; cursor: default; }
      #settings #s-source-status { overflow-wrap: anywhere; }
      #settings :focus-visible, #bar :focus-visible { outline: 2px solid #4fd37a; outline-offset: 2px; }
      /* profile card: bottom sheet on phones, right panel from 900px */
      #card { position: fixed; left: 0; right: 0; bottom: 0; max-height: 70vh; overflow-y: auto; overscroll-behavior: contain; z-index: 6;
        background: rgba(13,20,36,0.95); border: 1px solid rgba(255,255,255,0.1); border-bottom: 0; border-radius: 16px 16px 0 0;
        padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); backdrop-filter: blur(8px); box-shadow: 0 -8px 30px rgba(0,0,0,0.35); }
      #card[hidden] { display: none; }
      @media (min-width: 900px) { #card { left: auto; top: 14px; right: 16px; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); width: 424px; max-height: none;
        border-radius: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 18px 20px 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.35); } }
      #card .card-close { position: absolute; top: 10px; right: 10px; font: inherit; font-size: 22px; line-height: 1; color: var(--dim); background: transparent; border: 0; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; }
      #card .card-close:hover { color: var(--fg); background: rgba(255,255,255,0.06); }
      #card :focus-visible { outline: 2px solid #4fd37a; outline-offset: 2px; }
      /* the header is an ID badge: photo left (192x240, smaller on a narrow sheet), name and title right */
      #card .card-head { margin-bottom: 14px; }
      #card .card-badge { display: flex; gap: 14px; align-items: flex-start; }
      #card .card-photo { flex: none; display: block; width: 192px; max-width: 50%; height: auto; aspect-ratio: 4 / 5; border-radius: 12px; background: #e3e7ee;
        border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 3px 12px rgba(0,0,0,0.35); }
      #card .card-id { flex: 1; min-width: 0; padding: 4px 34px 0 0; }
      #card .card-name { margin: 0 0 4px; font-size: 22px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
      #card .card-title { font-size: 14px; color: var(--fg); overflow-wrap: anywhere; }
      #card .card-dept { font-size: 13px; color: var(--dim); margin-top: 2px; overflow-wrap: anywhere; }
      #card .card-sub { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
      #card .card-state { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: rgba(255,255,255,0.08); color: var(--fg); }
      #card .card-state::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: currentColor; }
      #card .card-state.working { color: #4fd37a; background: rgba(79,211,122,0.12); }
      #card .card-state.idle { color: #f2c14e; background: rgba(242,193,78,0.12); }
      #card .card-state.asleep { color: #8f9ab3; background: rgba(143,154,179,0.14); }
      #card .card-tag { font-size: 11px; border-radius: 999px; padding: 2px 8px; border: 1px solid rgba(255,255,255,0.14); color: var(--dim); }
      #card .card-tag.ph { color: #f2a33a; border-color: rgba(242,163,58,0.45); }
      #card .card-tag.lead { color: #7cc96a; border-color: rgba(124,201,106,0.45); }
      #card .card-sec { margin-top: 14px; }
      #card h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
      #card .card-work { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
      #card .card-what { font-size: 14px; overflow-wrap: anywhere; }
      #card .card-when, #card .card-meta { color: var(--dim); font-size: 12px; }
      #card .card-none, #card .card-note { color: var(--dim); font-size: 13px; }
      #card .card-facts { margin: 14px 0 0; display: grid; gap: 4px; font-size: 13px; }
      #card .card-facts > div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
      #card dt { color: var(--dim); } #card dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      #card .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
      #card .card-file { font-size: 12px; padding: 3px 9px; border-radius: 6px; background: rgba(90,167,255,0.12); color: #bcd8ff; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #card .card-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      #card .card-list li { display: grid; gap: 1px; font-size: 13px; }
      #card .card-list li.off .card-msg { color: var(--dim); }
      #card .card-msg { overflow-wrap: anywhere; color: var(--fg); }
      #card a.card-msg { text-decoration: none; border-bottom: 1px solid rgba(90,167,255,0.4); justify-self: start; }
      #card a.card-msg:hover { color: #bcd8ff; }
      #card .card-desc { font-size: 13px; line-height: 1.45; color: #c9d0de; }
      #card .card-desc p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      #card .card-rest { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 8px; }
      #card .card-rest[hidden] { display: none; }
      #card .card-foot { margin-top: 16px; font-size: 12px; font-style: italic; }
      #card .card-more { font: inherit; font-size: 12px; color: #5aa7ff; background: transparent; border: 0; padding: 4px 0; margin-top: 4px; cursor: pointer; }
      @media (max-width: 480px) { #settings { right: 12px; left: 12px; width: auto; } }
      /* phones: the bottom bar wraps to two rows so the gear stays on screen */
      @media (max-width: 480px) {
        #bar { flex-wrap: wrap; gap: 6px 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); }
        #radio input { width: 60px; } #radio button { min-width: 0; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #projects { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
        #settings { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); max-height: calc(100vh - 170px - env(safe-area-inset-bottom, 0px)); }
      }
      @media (max-width: 480px) { #hud { padding: 10px 12px; } #hud h1 { font-size: 16px; } .chip.counts { display: none; } #time button, #weather { padding: 5px 9px; } }
    </style>
    <script type="module" crossorigin src="./assets/index-CklnnvPU.js"></script>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud">
      <h1>Bot Office</h1>
      <span class="chip counts" id="counts"></span>
      <span class="chip" id="source"><span class="dot"></span>demo</span>
      <button type="button" class="chip" id="replay-btn" hidden title="Replay the last 24 hours of activity">&#10226; 24 h</button>
    </div>
    <div id="replay" hidden role="group" aria-label="Replay of the last 24 hours">
      <span class="r-label">Replay &middot; last 24 h</span>
      <button type="button" id="r-play" aria-label="Pause">&#10074;&#10074;</button>
      <input type="range" id="r-pos" min="0" max="1000" step="1" value="0" aria-label="Replay position">
      <span id="r-time">--</span>
      <select id="r-speed" aria-label="Replay speed"><option value="60">60&times;</option><option value="120" selected>120&times;</option><option value="600">600&times;</option></select>
      <button type="button" id="r-now">Now</button>
    </div>
    <aside id="projects" aria-label="Project progress"></aside>
    <div id="bar">
      <div id="time" role="group" aria-label="Time of day">
        <button type="button" data-phase="now" class="on">Now</button>
        <button type="button" data-phase="day">Day</button>
        <button type="button" data-phase="evening">Evening</button>
        <button type="button" data-phase="night">Night</button>
      </div>
      <button type="button" id="weather" title="Weather (cycles; the server can set it)">clear</button>
      <div id="radio" title="Ambient radio, generated in the browser">
        <button type="button" id="station" class="off">&#9835; Radio off</button>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.6" aria-label="Radio volume">
      </div>
      <button type="button" id="gear" title="Settings" aria-label="Settings" aria-expanded="false">&#9881;</button>
    </div>
    <section id="settings" hidden aria-label="Settings">
      <h2>Settings <button type="button" id="settings-close" aria-label="Close">&times;</button></h2>
      <div>
        <h3>Office source</h3>
        <label>Show <select id="s-source"><option value="demo">Demo</option><option value="file">Open a file</option><option value="link">Link</option><option value="live">Live server</option></select></label>
        <label data-for="file" hidden>office.json <input type="file" id="s-file" accept=".json,application/json"></label>
        <label data-for="link" hidden>Link <input type="url" id="s-link" placeholder="./office.json" spellcheck="false" autocomplete="off"></label>
        <label data-for="live" hidden>Server <input type="text" id="s-live" placeholder="this page's server" spellcheck="false" autocomplete="off" inputmode="url"></label>
        <p class="hint" id="s-source-status"></p>
        <div class="row">
          <button type="button" class="btn primary" id="s-source-use" hidden>Use this source</button>
          <button type="button" class="btn" id="s-replay" disabled>Replay last 24 h</button>
          <button type="button" class="btn" id="s-install" hidden>Install app</button>
        </div>
      </div>
      <div>
        <h3>Radio</h3>
        <label>Station <select id="s-station"><option value="-1">Off</option></select></label>
        <label>Volume <input type="range" id="s-volume" min="0" max="1" step="0.05" value="0.6"></label>
        <label><span>Follow the office<br><span class="hint">station picked from time of day and weather</span></span> <input type="checkbox" id="s-follow"></label>
        <label><span>Fade when the office is quiet</span> <input type="checkbox" id="s-quiet" checked></label>
      </div>
      <div>
        <h3>Bots</h3>
        <label><span>Show names</span> <input type="checkbox" id="s-names" checked></label>
      </div>
      <div>
        <h3>Window</h3>
        <label>Time of day <select id="s-phase"><option value="now">Follow the clock</option><option value="day">Day</option><option value="evening">Evening</option><option value="night">Night</option></select></label>
        <label>Weather <select id="s-weather"><option value="auto">From the server</option><option value="clear">Clear</option><option value="cloudy">Cloudy</option><option value="rain">Rain</option><option value="snow">Snow</option></select></label>
      </div>
      <p class="hint">Saved in this browser only. The office's real data (roster, projects, weather) is never changed here, and nothing is ever sent to a bot.</p>
    </section>
    <aside id="card" hidden aria-label="Bot profile">
      <button type="button" class="card-close" aria-label="Close">&times;</button>
      <div class="card-body"></div>
    </aside>
  </body>
</html>
